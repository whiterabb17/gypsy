[package]
name = "gypsy"
version = "0.2.0"
edition = "2021"

[features]
default = ["wasm-tools"]
wasm-tools = ["mentalist/wasm-tools"]

[dependencies]
# Local Agent & Memory Crates (Local Path Versions)
mentalist = { git = "https://github.com/whiterabb17/mentalist.git", version = "0.3.8", features = ["wasm-tools"] }
mem-core = { git = "https://github.com/whiterabb17/mindpalace.git", version = "0.3.1" }
brain = { git = "https://github.com/whiterabb17/mindpalace.git", version = "0.3.1" }
mem-resilience = { git = "https://github.com/whiterabb17/mindpalace.git", version = "0.3.1" }
mem-extractor = { git = "https://github.com/whiterabb17/mindpalace.git", version = "0.3.1" }
mem-retriever = { git = "https://github.com/whiterabb17/mindpalace.git", version = "0.3.1" }
mem-bridge = { git = "https://github.com/whiterabb17/mindpalace.git", version = "0.3.1" }
mem-offloader = { git = "https://github.com/whiterabb17/mindpalace.git", version = "0.3.1" }
mem-micro = { git = "https://github.com/whiterabb17/mindpalace.git", version = "0.3.1" }
mem-personality = { git = "https://github.com/whiterabb17/mindpalace.git", version = "0.3.1" }
mem-session = { git = "https://github.com/whiterabb17/mindpalace.git", version = "0.3.1" }
mem-compactor = { git = "https://github.com/whiterabb17/mindpalace.git", version = "0.3.1" }
mem-dreamer = { git = "https://github.com/whiterabb17/mindpalace.git", version = "0.3.1" }
mem-planner = { git = "https://github.com/whiterabb17/mindpalace.git", version = "0.3.1" }

# TUI stack
ratatui = "0.26"
crossterm = "0.27"

# Infrastructure
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
chrono = "0.4"
futures-util = "0.3"
futures-core = "0.3"
async-stream = "0.3"
async-trait = "0.1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2.1"
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
ollama-rs = { version = "0.2", features = ["stream"] }
thiserror = "1"
once_cell = "1.19"
ringbuffer = "0.15"
jsonschema = "0.17"
ruvector-core = "2.1"
ruvector-graph = "2.0"
secrecy = { version = "0.8", features = ["serde"] }
tracing-appender = "0.2"
metrics = "0.22"
ignore = "0.4"
config = "0.14"
arboard = "3.4"

[dev-dependencies]
tempfile = "3"

[patch."https://github.com/whiterabb17/mentalist.git"]
mentalist = { path = "../mentalist" }


[patch."https://github.com/whiterabb17/mindpalace.git"]
mem-core = { path = "../mindpalace/crates/mem-core", version = "0.3.1" }
brain = { path = "../mindpalace/crates/brain", version = "0.3.1" }
mem-resilience = { path = "../mindpalace/crates/mem-resilience", version = "0.3.1" }
mem-extractor = { path = "../mindpalace/crates/mem-extractor", version = "0.3.1" }
mem-retriever = { path = "../mindpalace/crates/mem-retriever", version = "0.3.1" }
mem-bridge = { path = "../mindpalace/crates/mem-bridge", version = "0.3.1" }
mem-offloader = { path = "../mindpalace/crates/mem-offloader", version = "0.3.1" }
mem-micro = { path = "../mindpalace/crates/mem-micro", version = "0.3.1" }
mem-personality = { path = "../mindpalace/crates/mem-personality", version = "0.3.1" }
mem-session = { path = "../mindpalace/crates/mem-session", version = "0.3.1" }
mem-compactor = { path = "../mindpalace/crates/mem-compactor", version = "0.3.1" }
mem-dreamer = { path = "../mindpalace/crates/mem-dreamer", version = "0.3.1" }
mem-broker = { path = "../mindpalace/crates/mem-broker", version = "0.3.1" }
mem-planner = { path = "../mindpalace/crates/mem-planner", version = "0.3.1" }

