[package]
name = "gypsy"
version = "0.1.10"
edition = "2021"

[features]
default = ["wasm-tools"]
wasm-tools = ["mentalist/wasm-tools"]

[dependencies]
# Local Agent & Memory Crates (Remote Git Versions)
mentalist = { git = "https://github.com/whiterabb17/mentalist.git", features = ["wasm-tools"] }
mem-core = { git = "https://github.com/whiterabb17/mindpalace.git" }
brain = { git = "https://github.com/whiterabb17/mindpalace.git" }
mem-resilience = { git = "https://github.com/whiterabb17/mindpalace.git" }
mem-extractor = { git = "https://github.com/whiterabb17/mindpalace.git" }
mem-retriever = { git = "https://github.com/whiterabb17/mindpalace.git" }
mem-bridge = { git = "https://github.com/whiterabb17/mindpalace.git" }
mem-offloader = { git = "https://github.com/whiterabb17/mindpalace.git" }
mem-micro = { git = "https://github.com/whiterabb17/mindpalace.git" }
mem-personality = { git = "https://github.com/whiterabb17/mindpalace.git" }
mem-session = { git = "https://github.com/whiterabb17/mindpalace.git" }
mem-compactor = { git = "https://github.com/whiterabb17/mindpalace.git" }
mem-dreamer = { git = "https://github.com/whiterabb17/mindpalace.git" }

# TUI stack
ratatui = "0.26"
crossterm = "0.27"

# Infrastructure
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
chrono = "0.4"
futures-util = "0.3"
futures-core = "0.3"
async-stream = "0.3"
async-trait = "0.1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2.1"
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
ollama-rs = { version = "0.2", features = ["stream"] }
thiserror = "1"
once_cell = "1.19"
ringbuffer = "0.15"
jsonschema = "0.17"
ruvector-core = "2.1"
ruvector-graph = "2.0"
secrecy = { version = "0.8", features = ["serde"] }
tracing-appender = "0.2"
metrics = "0.22"
ignore = "0.4"
config = "0.14"

[patch."https://github.com/whiterabb17/mentalist.git"]
mentalist = { path = "../mentalist" }

[patch."https://github.com/whiterabb17/mindpalace.git"]
mem-core = { path = "../mindpalace/crates/mem-core" }
brain = { path = "../mindpalace/crates/brain" }
mem-resilience = { path = "../mindpalace/crates/mem-resilience" }
mem-extractor = { path = "../mindpalace/crates/mem-extractor" }
mem-retriever = { path = "../mindpalace/crates/mem-retriever" }
mem-bridge = { path = "../mindpalace/crates/mem-bridge" }
mem-offloader = { path = "../mindpalace/crates/mem-offloader" }
mem-micro = { path = "../mindpalace/crates/mem-micro" }
mem-personality = { path = "../mindpalace/crates/mem-personality" }
mem-session = { path = "../mindpalace/crates/mem-session" }
mem-compactor = { path = "../mindpalace/crates/mem-compactor" }
mem-dreamer = { path = "../mindpalace/crates/mem-dreamer" }
