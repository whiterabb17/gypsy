[package]
name = "gypsy"
version = "0.1.6"
edition = "2021"

[dependencies]
# Local Agent & Memory Crates
mentalist = { path = "../mentalist", features = ["wasm-tools"] }
mem-core = { git = "https://github.com/whiterabb17/mindpalace.git" }
brain = { git = "https://github.com/whiterabb17/mindpalace.git" }
mem-resilience = { git = "https://github.com/whiterabb17/mindpalace.git" }

# TUI stack
ratatui = "0.26"
crossterm = "0.27"

# Infrastructure
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
chrono = "0.4"
futures-util = "0.3"
futures-core = "0.3"
async-stream = "0.3"
async-trait = "0.1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
colored = "2.1"
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
ollama-rs = "0.1"
